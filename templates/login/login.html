<!doctype html>
<!-- Tela de entrada na conta do usuário. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f4a2b">
  <title>EcoPoints - Login</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='ecopoints-favicon-239e7a5f8c.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='ecopoints-favicon-239e7a5f8c.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --green-dark: #0f4a2b; --green-main: #579a22; --green-hover: #467a1a; --cream: #f8f5ee; --ink: #33372f; --muted: #777970; }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; padding: 28px 18px; display: flex; align-items: center; justify-content: center; position: relative; isolation: isolate; background: var(--cream); color: var(--ink); font-family: Inter, sans-serif; overflow-x: hidden; overflow-y: auto; }
    .wave-bg { position: fixed; bottom: 0; right: 0; width: min(45vw, 600px); max-height: 60vh; object-fit: contain; object-position: right bottom; z-index: -1; pointer-events: none; }
    .login-wrapper { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); align-items: center; gap: clamp(28px, 6vw, 76px); width: min(100%, 1000px); padding: 24px; margin: auto; position: relative; z-index: 1; }
    .left-side { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .logo-img { display: block; width: min(250px, 70%); max-height: 110px; object-fit: contain; margin-bottom: 22px; }
    .bins-container { display: flex; align-items: center; justify-content: center; width: 100%; }
    .bins-img { display: block; width: min(380px, 100%); max-height: 45vh; object-fit: contain; mix-blend-mode: multiply; }
    .right-side { width: 100%; min-width: 0; max-width: 380px; justify-self: center; }
    #loginForm { width: 100%; }
    .form-heading { margin: 0 0 24px; text-align: center; color: #1b3d1b; font: 800 clamp(1.5rem, 3vw, 1.9rem)/1.2 Montserrat, sans-serif; }
    .custom-input-group { position: relative; margin-bottom: 16px; }
    .custom-input-group input { width: 100%; min-height: 54px; display: block; padding: 13px 48px 13px 16px; font: 16px/1.35 Inter, sans-serif; color: #333; background: var(--cream); border: 1px solid #c4c4c4; border-radius: 8px; outline: none; box-shadow: inset 2px 2px 5px rgba(0,0,0,.04); }
    .custom-input-group input::placeholder { color: #8d8d87; }
    .custom-input-group input:focus { border-color: #5b922a; box-shadow: 0 0 0 3px rgba(91,146,42,.13); }
    .password-toggle { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); width: 40px; height: 40px; display: inline-flex; justify-content: center; align-items: center; border: 0; border-radius: 8px; background: transparent; color: #777; cursor: pointer; font-size: 1.15rem; }
    .password-toggle:hover, .password-toggle:focus-visible { background: rgba(0,0,0,.05); }
    .forgot-password { text-align: right; font-size: 13px; margin: -2px 0 15px; }
    .forgot-password a { color: #6f6c64; text-decoration: none; }
    .forgot-password a:hover { color: var(--green-hover); text-decoration: underline; }
    .btn-login { width: 100%; min-height: 54px; padding: 12px 48px; background: linear-gradient(90deg, #579a22 0%, #467a1a 100%); color: #fff; font: 700 16px/1.35 Inter, sans-serif; border: 0; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,.1); transition: filter .2s ease, transform .2s ease; }
    .btn-login:hover { filter: brightness(.96); }
    .btn-login:active { transform: translateY(1px); }
    .btn-login:disabled { opacity: .65; cursor: wait; }
    .btn-login .btn-text { text-align: center; }
    .btn-login .btn-icon { position: absolute; right: 18px; width: 12px; height: 16px; fill: currentColor; }
    .divider { display: flex; align-items: center; gap: 14px; margin: 23px 0 18px; color: #888; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #d3d3d3; }
    .social-login { display: flex; justify-content: center; margin-bottom: 20px; }
    .google-login-btn { display: inline-flex; align-items: center; justify-content: center; gap: 11px; width: 100%; min-height: 48px; border: 1px solid #d9d8d1; border-radius: 8px; background: #fffdf8; color: #444; font: 600 14px Inter, sans-serif; cursor: pointer; transition: background .2s ease, border-color .2s ease; }
    .google-login-btn:hover { background: #fff; border-color: #aaa99f; }
    .google-icon { width: 22px; height: 22px; flex: 0 0 22px; }
    #loginError { color: #c0392b; text-align: center; font-size: 13px; line-height: 1.5; margin: 0 0 12px; overflow-wrap: anywhere; }
    .terms-text { text-align: center; font-size: 11px; color: #888; line-height: 1.6; margin: 13px 0 0; }
    .signup-link { text-align: center; font-size: 13px; color: #777; margin: 15px 0 0; line-height: 1.5; }
    .signup-link a { color: var(--green-hover); font-weight: 700; text-decoration: none; }
    .signup-link a:hover { text-decoration: underline; }
    @media (max-width: 760px) {
      body { padding: 22px 16px; align-items: flex-start; }
      .login-wrapper { grid-template-columns: minmax(0, 1fr); gap: 18px; width: min(100%, 430px); padding: 10px 0 24px; }
      .left-side { margin: 0; }
      .logo-img { width: min(200px, 58%); max-height: 75px; margin-bottom: 4px; }
      .bins-img { width: min(230px, 65%); max-height: 22vh; }
      .right-side { max-width: 430px; padding: 0; }
      .form-heading { margin: 0 0 20px; }
      .wave-bg { width: min(72vw, 420px); max-height: 40vh; opacity: .8; }
    }
    @media (max-width: 420px) {
      body { padding: 14px 14px 22px; }
      .login-wrapper { gap: 12px; }
      .logo-img { width: min(175px, 60%); }
      .bins-img { width: min(180px, 58%); max-height: 17vh; }
      .custom-input-group input { min-height: 52px; padding-left: 14px; }
      .divider { margin: 19px 0 15px; }
      .terms-text { font-size: 10.5px; }
    }
    @media (max-height: 680px) and (min-width: 761px) {
      body { align-items: flex-start; }
      .login-wrapper { padding-top: 10px; padding-bottom: 10px; }
      .bins-img { max-height: 34vh; }
      .logo-img { max-height: 75px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <img src="{{ url_for('static', filename='Vector 1.png') }}" alt="" class="wave-bg" aria-hidden="true">
  <!-- Conteúdo principal apresentado nesta página. -->
  <main class="login-wrapper">
    <!-- Seção de conteúdo desta página. -->
    <section class="left-side" aria-label="Identidade visual EcoPoints">
      <img src="{{ url_for('static', filename='titulo.png') }}" alt="EcoPoints" class="logo-img">
      <div class="bins-container"><img src="{{ url_for('static', filename='lixeiras.png') }}" alt="Lixeiras de reciclagem" class="bins-img"></div>
    </section>

    <!-- Seção de conteúdo desta página. -->
    <section class="right-side" aria-label="Acessar sua conta">
      <!-- Formulário: reúne os campos enviados pelo usuário e as ações de envio. -->
      <form id="loginForm">
        <h1 class="form-heading">Entre na sua conta</h1>
        <div class="custom-input-group"><input type="email" id="emailInput" placeholder="E-mail" autocomplete="email" required aria-label="E-mail"></div>
        <div class="custom-input-group">
          <input type="password" id="passwordInput" placeholder="Senha" autocomplete="current-password" required aria-label="Senha">
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar senha"><i class="bi bi-eye-slash" aria-hidden="true"></i></button>
        </div>
        <p class="forgot-password"><a href="#" id="forgotPasswordLink">Esqueci minha senha</a></p>
        <button type="submit" class="btn-login" id="btnLogin"><span class="btn-text" id="btnLoginText">Login</span><svg class="btn-icon" viewBox="0 0 10 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M1.5 0L0 1.5L6.5 8L0 14.5L1.5 16L9.5 8L1.5 0Z" /></svg></button>
        <div class="divider">ou</div>
        <div class="social-login">
          <button type="button" class="google-login-btn" id="googleLoginBtn">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continuar com Google
          </button>
        </div>
        <p id="loginError" role="status" aria-live="polite"></p>
        <p class="terms-text">Ao continuar, você concorda com nossos termos de uso e política de privacidade. O EcoPoints protege a sua privacidade.</p>
        <p class="signup-link">Não tem uma conta? <a href="/cadastro">Cadastre-se</a></p>
      </form>
    </section>
  </main>

  <!-- JavaScript: controla comportamentos interativos desta página. -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyApm0Z0DnU3Up012atks4u3a1BRMzsrn7A",
      authDomain: "tcc-ecopoint.firebaseapp.com",
      projectId: "tcc-ecopoint",
      storageBucket: "tcc-ecopoint.firebasestorage.app",
      messagingSenderId: "35042020793",
      appId: "1:35042020793:web:5bd4b36b58644dfbd6ba68"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const googleBtn = document.getElementById('googleLoginBtn');
    const errorMsg = document.getElementById('loginError');
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const btnLogin = document.getElementById('btnLogin');
    const btnLoginText = document.getElementById('btnLoginText');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');

    async function autenticarNoBackend(idToken) {
      try {
        const response = await fetch('/auth/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken })
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.success) {
          window.location.href = '/dashboard';
        } else {
          errorMsg.textContent = data.message || 'Não foi possível entrar. Tente novamente.';
        }
      } catch (error) {
        console.error('Falha ao autenticar no servidor:', error);
        errorMsg.textContent = 'Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.';
      }
    }

    googleBtn.addEventListener('click', async () => {
      if (btnLogin.disabled) return;
      errorMsg.style.color = '#c0392b';
      errorMsg.textContent = '';
      btnLogin.disabled = true;
      googleBtn.disabled = true;
      try {
        const result = await signInWithPopup(auth, provider);
        const idToken = await result.user.getIdToken(true);
        await autenticarNoBackend(idToken);
      } catch (err) {
        console.error('Falha no login com Google:', err.code || err.name);
        const mensagens = {
          'auth/popup-closed-by-user': 'A janela do Google foi fechada antes de concluir o login.',
          'auth/popup-blocked': 'Permita pop-ups para este site e tente novamente.',
          'auth/cancelled-popup-request': 'Já existe uma tentativa de login aberta. Tente novamente.',
          'auth/unauthorized-domain': 'Este domínio precisa ser autorizado no Firebase Authentication.',
          'auth/operation-not-allowed': 'Ative o provedor Google no Firebase Authentication.',
          'auth/network-request-failed': 'Falha de conexão com o Google. Verifique sua internet.'
        };
        errorMsg.textContent = mensagens[err.code] || 'Login com Google falhou. Tente novamente.';
      } finally {
        btnLogin.disabled = false;
        googleBtn.disabled = false;
      }
    });

    forgotPasswordLink.addEventListener('click', async event => {
      event.preventDefault();
      errorMsg.style.color = '#c0392b';
      errorMsg.textContent = '';
      const email = emailInput.value.trim();
      if (!email) {
        errorMsg.textContent = 'Digite seu e-mail no campo acima primeiro.';
        emailInput.focus();
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        errorMsg.style.color = '#3f7d24';
        errorMsg.textContent = 'Enviamos um link de redefinição de senha para ' + email + '.';
      } catch (err) {
        console.error('Falha ao redefinir senha:', err.code || err.name);
        errorMsg.textContent = 'Não foi possível enviar o e-mail de redefinição. Confira se o e-mail está correto.';
      }
    });

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      errorMsg.style.color = '#c0392b';
      errorMsg.textContent = '';
      const email = emailInput.value.trim();
      const senha = passwordInput.value;
      btnLogin.disabled = true;
      googleBtn.disabled = true;
      btnLoginText.textContent = 'Entrando...';
      try {
        const cred = await signInWithEmailAndPassword(auth, email, senha);
        const idToken = await cred.user.getIdToken(true);
        await autenticarNoBackend(idToken);
      } catch (err) {
        const mensagens = {
          'auth/invalid-email': 'E-mail inválido.',
          'auth/user-not-found': 'E-mail ou senha incorretos.',
          'auth/invalid-credential': 'E-mail ou senha incorretos.',
          'auth/wrong-password': 'E-mail ou senha incorretos.',
          'auth/too-many-requests': 'Muitas tentativas. Tente novamente mais tarde.',
          'auth/network-request-failed': 'Falha de conexão. Verifique sua internet.'
        };
        errorMsg.textContent = mensagens[err.code] || 'Não foi possível entrar. Tente novamente.';
      } finally {
        btnLogin.disabled = false;
        googleBtn.disabled = false;
        btnLoginText.textContent = 'Login';
      }
    });

    const togglePassword = document.getElementById('togglePassword');
    togglePassword.addEventListener('click', () => {
      const showing = passwordInput.type === 'password';
      passwordInput.type = showing ? 'text' : 'password';
      togglePassword.innerHTML = showing ? '<i class="bi bi-eye" aria-hidden="true"></i>' : '<i class="bi bi-eye-slash" aria-hidden="true"></i>';
      togglePassword.setAttribute('aria-label', showing ? 'Ocultar senha' : 'Mostrar senha');
    });
  </script>
</body>
</html>
