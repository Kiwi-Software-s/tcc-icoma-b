<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EcoPoints - Acesso restrito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f3ec;color:#43463f;font-family:Inter,sans-serif}
    .box{width:min(480px,100%);padding:34px;text-align:center;background:#fffdf8;border:1px solid #e5dfd4;border-radius:18px;box-shadow:0 18px 50px rgba(31,70,36,.08)}
    .icon{width:64px;height:64px;margin:0 auto 17px;display:grid;place-items:center;border-radius:18px;background:#eef7e6;color:#3d7d2c;font-size:29px}
    h1{margin:0 0 8px;font:800 25px/1.2 Montserrat,sans-serif;color:#234f2d} p{margin:0 auto 22px;max-width:340px;color:#858279;line-height:1.55;font-size:13px}
    a{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:9px;background:#3d7d2c;color:#fff;text-decoration:none;font-weight:700;font-size:13px}
  </style>
</head>
<body>
  <main class="box">
    <div class="icon"><i class="bi bi-shield-lock-fill"></i></div>
    <h1>Acesso restrito</h1>
    <p>Esta é uma área {{ area or 'restrita' }}. Sua conta não possui a permissão necessária para acessá-la.</p>
    <a href="{{ url_for('home.dashboard') }}"><i class="bi bi-arrow-left"></i> Voltar à dashboard</a>
  </main>
</body>
</html>
