<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EcoPoints - Login</title>
    
    <style>
        /* RESET E FONTES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* FUNDO DA PÁGINA */
        body {
            background-color: #F8F5EE; /* Cor bege da imagem original */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* ONDA VERDE DE FUNDO (Usando sua imagem Vector 1.png) */
        .wave-bg {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 45vw; /* Ajuste conforme necessário para o tamanho da onda */
            max-width: 600px;
            z-index: -1;
        }

        /* CONTAINER PRINCIPAL */
        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            z-index: 1;
            align-items: center;
            justify-content: space-between;
        }

        /* LADO ESQUERDO (IMAGENS) */
        .left-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            max-width: 250px; /* Ajustado tamanho da logo */
            margin-bottom: 20px;
        }

        .bins-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .bins-img {
            max-width: 100%;
            width: 380px;
            z-index: 1;
            mix-blend-mode: multiply; /* Ajuda a imagem jpg a se mesclar com o fundo se não tiver fundo transparente */
        }

        /* LADO DIREITO (FORMULÁRIO) */
        .right-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 380px; /* Alargado um pouco para ficar fiel */
            margin-left: 50px;
            padding: 20px;
        }

        /* INPUTS */
        .custom-input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .custom-input-group input {
            width: 100%;
            height: 55px;
            padding: 10px 20px;
            font-size: 16px;
            color: #333;
            background-color: #F8F5EE; /* Mesma cor do fundo da página */
            border: 1px solid #C4C4C4; /* Borda cinza do design */
            border-radius: 8px; /* Bordas um pouco mais arredondadas */
            outline: none;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05); /* Sombra interna leve */
        }

        .custom-input-group input::placeholder {
            color: #A0A0A0;
        }

        .custom-input-group input:focus {
            border-color: #5b922a;
        }

        /* ÍCONE DE SENHA (Usando sua imagem Invisible.png) */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 24px;
            height: 24px;
            background-image: url('../../static/Invisible.png');
            background-size: cover;
            background-position: center;
            opacity: 0.5; /* Deixa o ícone um pouco mais cinza */
        }

        /* Classe adicionada via JS quando o olho estiver 'aberto' */
        .password-toggle.visible {
            opacity: 0.9;
            /* Se você tiver outro ícone para o olho aberto, mudaria o background-image aqui */
        }

        /* BOTÃO DE LOGIN */
        .btn-login {
            width: 100%;
            height: 55px;
            background: linear-gradient(90deg, #579A22 0%, #467a1a 100%); /* Verde da imagem */
            color: white;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .btn-login .btn-text {
            margin: 0 auto;
        }

        .btn-login .btn-icon {
            position: absolute;
            right: 20px;
            width: 14px;
            height: 14px;
            fill: white;
        }

        /* DIVISOR "or" */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0 20px;
            color: #888;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #D3D3D3;
        }

        .divider::before {
            margin-right: 15px;
        }

        .divider::after {
            margin-left: 15px;
        }

        /* LOGIN GOOGLE */
        .social-login {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .google-icon {
            width: 28px;
            height: 28px;
            cursor: pointer;
        }

        /* TERMOS DE USO */
        .terms-text {
            text-align: center;
            font-size: 12px;
            color: #888;
            line-height: 1.5;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 850px) {
            .login-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .left-side {
                margin-bottom: 40px;
            }
            .right-side {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <img src="../../static/Vector 1.png" alt="Fundo verde" class="wave-bg">

    <main class="login-wrapper">
        
        <div class="left-side">
            <img src="../../static/titulo.png" alt="EcoPoints Logo" class="logo-img">
            
            <div class="bins-container">
                <img src="../../static/lixeiras.png" alt="Lixeiras de Reciclagem" class="bins-img">
            </div>
        </div>

        <div class="right-side">
            <form id="loginForm">
                <div class="custom-input-group">
                    <input type="email" placeholder="E-mail" required>
                </div>

                <div class="custom-input-group">
                    <input type="password" id="passwordInput" placeholder="Senha" required>
                    
                    <div class="password-toggle" id="togglePassword"></div>
                </div>

                <button type="submit" class="btn-login">
                    <span class="btn-text">Login</span>
                    <svg class="btn-icon" viewBox="0 0 10 16" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1.5 0L0 1.5L6.5 8L0 14.5L1.5 16L9.5 8L1.5 0Z" />
                    </svg>
                </button>

                <div class="divider">or</div>

                <div class="social-login">
                    <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </div>

                <p class="terms-text">
                    Ao continuar, você concorda com os nossos termos<br>
                    de uso e política da privacidade. O EcoPoints<br>
                    protege a sua privacidade.
                </p>
            </form>
        </div>
    </main>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');

        togglePassword.addEventListener('click', function () {
            // Alterna o tipo do input entre 'password' e 'text'
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Alterna a classe para mudar o visual (se desejar alterar a opacidade/ícone)
            this.classList.toggle('visible');
        });
    </script>
</body>

</html>
